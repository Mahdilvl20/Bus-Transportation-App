name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  build:
    name: Tests and release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify the release APK exists
        run: test -f app/build/outputs/apk/release/IsfahanBus-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: IsfahanBus-release-apk
          path: app/build/outputs/apk/release/IsfahanBus-release.apk
          if-no-files-found: error

  abi-splits:
    name: ABI-specific release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ABI splits are opt-in in Gradle (-PabiSplits), so this cannot collide with
      # the plain release build running in the job above.
      - name: Build ABI-specific release APKs
        run: ./gradlew assembleRelease -PabiSplits --stacktrace

      - name: Verify every expected APK exists
        run: |
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "app/build/outputs/apk/release/IsfahanBus-${abi}-release.apk"
          done

      - name: Upload ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: IsfahanBus-abi-apks
          path: app/build/outputs/apk/release/IsfahanBus-*-release.apk
          if-no-files-found: error
